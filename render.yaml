services:
  - type: web
    name: pta-chat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthcheckPath: /mcp
    autoDeploy: true
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: HOST
        value: 0.0.0.0
      # PTA_COOKIE is set manually in the Render dashboard as a secret
      # (Environment tab -> Add Environment Variable -> do not sync).
      - key: PTA_COOKIE
        sync: false
