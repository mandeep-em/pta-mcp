[project]
name = "pta-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
]

[project.optional-dependencies]
recon = ["playwright>=1.63.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pta_mcp"]

[project.scripts]
pta-mcp = "pta_mcp.server:main"
